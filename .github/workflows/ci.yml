name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: tools
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor
          fallback: none
      - name: format
        run: pnpm exec oxfmt --check
      - name: lint
        run: pnpm exec oxlint --format github
      - name: types
        run: pnpm exec tsc --noEmit
      - name: test
        run: pnpm exec vitest run
      - name: workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor --format=github .
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
